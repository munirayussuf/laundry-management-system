services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: laundry
      POSTGRES_USER: laundry
      POSTGRES_PASSWORD: laundry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://laundry:laundry@db:5432/laundry
      JWT_SECRET: change-this-secret-before-production
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  postgres_data:
