name: laundry_service_app
description: Laundry Service Management System for Kenya. Supports formal laundry businesses and Mama Fua / Jua Kali operators, with customer, provider and admin experiences on top of Firebase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6


  # State management (Riverpod chosen consistently across the whole app)
  flutter_riverpod: ^2.5.1

  # Routing with role based redirection
  go_router: ^13.2.4

  # Forms and validation
  form_validator: ^2.1.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  lottie: ^3.1.2
  fl_chart: ^0.68.0
  flutter_rating_bar: ^4.0.1
  intl: ^0.19.0

  # Utilities
  uuid: ^4.4.0
  equatable: ^2.0.5
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  logger: ^2.4.0
  dio: ^5.5.0+1
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
