databases:
  - name: laundry-db
    databaseName: laundry
    user: laundry
    plan: free
    region: frankfurt
    postgresMajorVersion: 16

services:
  - type: web
    name: laundry-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: laundry-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
